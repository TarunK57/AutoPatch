version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autopatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/backend
      - AUTOPATCH_ENV=production
      - AUTOPATCH_HOST=0.0.0.0
      - AUTOPATCH_PORT=8000
    volumes:
      - autopatch-data:/tmp/autopatch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autopatch-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autopatch-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - autopatch-net

networks:
  autopatch-net:
    driver: bridge

volumes:
  autopatch-data:
    driver: local
